name: windows-release

# v* tag 的构建与发版。独立于 windows.yml 的原因：paths-ignore（忽略 *.md）
# 对 tag push 同样生效，会让仅文档变更的 tag 静默跳过发布；tag 触发不应受
# 路径过滤影响，因此本 workflow 不声明任何 paths 过滤。
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependency sources
        id: dependency-sources
        uses: actions/cache/restore@v4
        with:
          path: .build/windows-vs2022/_deps/*-src
          key: windows-2022-dependency-sources-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'CMakePresets.json', '.github/workflows/*.yml') }}
      - name: Configure
        shell: pwsh
        env:
          ANOMALY_DEPENDENCIES_CACHED: ${{ steps.dependency-sources.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
        run: |
          $arguments = @(
            '--preset', 'windows-vs2022',
            '-DANOMALY_BUILD_TEST_FIXTURES=OFF',
            '-DANOMALY_BUILD_TEST_PLUGINS=OFF',
            "-DFETCHCONTENT_FULLY_DISCONNECTED=$env:ANOMALY_DEPENDENCIES_CACHED"
          )
          $arguments += "-DANOMALY_RELEASE_VERSION=$env:GITHUB_REF_NAME"
          cmake @arguments
      - name: Save dependency sources
        if: steps.dependency-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/windows-vs2022/_deps/*-src
          key: ${{ steps.dependency-sources.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset windows-relwithdebinfo --parallel
      - name: Plugin i18n gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/check_plugin_i18n.ps1
      - name: Package runtime, tools and SDK
        shell: pwsh
        run: ./tools/package_release.ps1 -BuildDirectory .build/windows-vs2022 -Version ($env:GITHUB_REF_NAME).TrimStart('v') -Configuration RelWithDebInfo
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          if-no-files-found: error
  release:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check release notes
        id: notes
        shell: pwsh
        run: |
          if (!(Test-Path CHANGES.md) -or (Get-Item CHANGES.md).Length -eq 0) {
            throw 'git-cliff did not generate release notes.'
          }
          Get-Content CHANGES.md
          "body<<ANOMALY_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content CHANGES.md -Raw | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ANOMALY_NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: .build/release
      - name: Attest published archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
      - name: Publish runtime, tools and SDK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/release/Anomaly-*-runtime.zip
            .build/release/Anomaly-*-tools.zip
            .build/release/Anomaly-*-sdk.zip
          fail_on_unmatched_files: true
          body_path: CHANGES.md
      - name: Announce release on Discord
        uses: SethCohen/github-releases-to-discord@v1.20
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: Anomaly ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          color: '11052455'
          username: Anomaly
          avatar_url: https://raw.githubusercontent.com/xiaotian2333/Mayday-Airways-Anomaly/main/logo.png
          footer_title: Anomaly
          footer_icon_url: https://raw.githubusercontent.com/xiaotian2333/Mayday-Airways-Anomaly/main/logo.png
          footer_timestamp: true
